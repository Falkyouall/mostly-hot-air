<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mostly Hot Air — Wind Matrix Beta</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #b5d4e8;
    }
    canvas { display: block; }

    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(40, 30, 20, 0.78);
      color: #f5ecd8;
      padding: 14px 18px;
      border-radius: 6px;
      pointer-events: none;
      min-width: 180px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    #hud .row { margin-bottom: 10px; }
    #hud .row:last-child { margin-bottom: 0; }
    #hud .label {
      font-size: 10px;
      letter-spacing: 1.3px;
      color: #b8a580;
      text-transform: uppercase;
      display: block;
      margin-bottom: 2px;
    }
    #hud .value {
      font-size: 18px;
      font-weight: 600;
      color: #f5ecd8;
    }
    #hud .info {
      font-size: 12px;
      color: #e8c97a;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(184, 165, 128, 0.3);
    }

    #windPanel {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(40, 30, 20, 0.78);
      color: #f5ecd8;
      padding: 14px 18px;
      border-radius: 6px;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    #windPanel .title {
      font-size: 10px;
      letter-spacing: 1.3px;
      color: #b8a580;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    #windPanel .bandRow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px;
      border-radius: 4px;
      margin-bottom: 2px;
      font-size: 13px;
      transition: background 0.2s;
    }
    #windPanel .bandRow.active {
      background: rgba(232, 201, 122, 0.25);
      color: #ffe9a8;
    }
    #windPanel .colorDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #windPanel .arrow {
      display: inline-block;
      width: 18px;
      text-align: center;
      font-size: 16px;
    }

    #altitudeBar {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 46px;
      height: 300px;
      background: rgba(40, 30, 20, 0.78);
      border-radius: 6px;
      padding: 8px 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      box-sizing: border-box;
    }
    #altitudeBar .track {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column-reverse;
    }
    #altitudeBar .seg {
      flex: 1 1 0;
      border-radius: 2px;
      margin: 1px 0;
      opacity: 0.35;
      transition: opacity 0.2s;
    }
    #altitudeBar .seg.active { opacity: 1; }
    #altitudeBar .seg1 { background: #ff6b6b; }
    #altitudeBar .seg2 { background: #4ecdc4; }
    #altitudeBar .seg3 { background: #ffe66a; }
    #altitudeBar .marker {
      position: absolute;
      left: -4px;
      width: 42px;
      height: 2px;
      background: #fff;
      box-shadow: 0 0 4px rgba(255,255,255,0.8);
      pointer-events: none;
      transition: bottom 0.05s linear;
    }
    #altitudeBar .label {
      position: absolute;
      left: -40px;
      font-size: 10px;
      color: #b8a580;
      letter-spacing: 1px;
    }

    #prompt {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(40, 30, 20, 0.78);
      color: #f5ecd8;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    #prompt kbd {
      background: #3d2f1f;
      border: 1px solid #5d4b35;
      padding: 2px 7px;
      border-radius: 3px;
      font-family: monospace;
      margin: 0 2px;
      color: #ffe9a8;
    }

    #winBanner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(60, 130, 70, 0.95);
      color: white;
      padding: 40px 60px;
      border-radius: 12px;
      font-size: 28px;
      font-weight: 700;
      display: none;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #winBanner .sub {
      font-size: 14px;
      font-weight: 400;
      margin-top: 12px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="row"><span class="label">Höhe</span><span class="value" id="altitude">50 m</span></div>
    <div class="row"><span class="label">Aktuelles Band</span><span class="value" id="band">Band 1</span></div>
    <div class="row"><span class="label">Distanz zum Ziel</span><span class="value" id="distance">3000 m</span></div>
    <div class="info" id="info">Mechanik-Test · Brennstoff unbegrenzt</div>
  </div>

  <div id="altitudeBar">
    <div class="track">
      <div class="seg seg1" id="seg1"></div>
      <div class="seg seg2" id="seg2"></div>
      <div class="seg seg3" id="seg3"></div>
      <div class="marker" id="altMarker"></div>
    </div>
  </div>

  <div id="windPanel">
    <div class="title">Wind-Matrix</div>
    <div class="bandRow" id="bandRow3">
      <div class="colorDot" style="background: #ffe66a;"></div>
      <span>Band 3 (oben)</span>
      <span class="arrow" id="arrow3">→</span>
    </div>
    <div class="bandRow" id="bandRow2">
      <div class="colorDot" style="background: #4ecdc4;"></div>
      <span>Band 2 (mitte)</span>
      <span class="arrow" id="arrow2">→</span>
    </div>
    <div class="bandRow" id="bandRow1">
      <div class="colorDot" style="background: #ff6b6b;"></div>
      <span>Band 1 (unten)</span>
      <span class="arrow" id="arrow1">→</span>
    </div>
  </div>

  <div id="prompt"><kbd>Leertaste</kbd> halten = Brenner &nbsp;&middot;&nbsp; <kbd>R</kbd> = Reset</div>

  <div id="winBanner">
    🎈 Ziel erreicht!
    <div class="sub">Drücke <b>R</b> für einen neuen Versuch</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ==========================================================
    // CONFIG
    // ==========================================================
    const BAND_HEIGHT = 100;          // m per band
    const BAND_COUNT = 3;
    const WIND_SPEED = 30;            // m/s — arcade-y for quick mechanic tests
    const GOAL_DISTANCE = 300;        // m
    const LANDING_ZONE_RADIUS = 25;   // m
    const PASSIVE_SINK = 8.0;         // m/s — fast sink for quick testing
    const ACTIVE_RISE = 14.0;         // m/s net rise under full burner
    const BURNER_RAMP = 0.2;          // s to full burner power (snappy)
    const TURBULENCE_AMPLITUDE = 0.18;
    const TRANSITION_WIDTH = 0.15;

    // Ballon-Modell (GLB) — wechsle zwischen den drei Modellen:
    // 'ballon.glb', 'hot_air_balloon.glb', 'hot_air_balloon_modern.glb'
    const BALLON_MODEL = 'hot_air_balloon_modern.glb';
    const BALLON_TARGET_HEIGHT = 18;  // m — alle Modelle werden darauf normalisiert

    // Wind vectors — 180° test satisfied (three at 120° apart)
    // Band 1: East (toward goal) — direct path
    // Band 2: Northwest — away from goal, rotated up-left
    // Band 3: Southwest — away from goal, rotated down-left
    const BAND_WIND_DIRS = [
      new THREE.Vector3(1, 0, 0),                           // Band 1: East
      new THREE.Vector3(-0.5, 0, -Math.sqrt(3)/2),          // Band 2: -X -Z (upper-left in top view)
      new THREE.Vector3(-0.5, 0, Math.sqrt(3)/2),           // Band 3: -X +Z (lower-left)
    ];
    const BAND_WINDS = BAND_WIND_DIRS.map(d => d.clone().multiplyScalar(WIND_SPEED));

    // ==========================================================
    // 180° VALIDATION (H1_DESIGN §4.4)
    // ==========================================================
    function validateWindMatrix(vectors) {
      const angles = vectors.map(v => Math.atan2(v.z, v.x)).sort((a, b) => a - b);
      const gaps = [
        angles[1] - angles[0],
        angles[2] - angles[1],
        2 * Math.PI - angles[2] + angles[0],
      ];
      const maxGap = Math.max(...gaps);
      return { passed: maxGap < Math.PI, maxGapDeg: (maxGap * 180 / Math.PI).toFixed(1) };
    }

    const validation = validateWindMatrix(BAND_WINDS);
    console.log(`Wind-Matrix ${validation.passed ? '✓' : '✗'} (max gap ${validation.maxGapDeg}°)`);
    if (!validation.passed) {
      alert(`Level ungültig — Wind-Matrix besteht 180°-Regel nicht (max. Lücke ${validation.maxGapDeg}°)`);
    }

    // ==========================================================
    // SCENE
    // ==========================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb5d4e8);
    scene.fog = new THREE.Fog(0xcadcea, 800, 4500);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 6000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Lighting — warm golden-hour feel
    scene.add(new THREE.AmbientLight(0xcbd9e8, 0.55));
    const sun = new THREE.DirectionalLight(0xfff1c4, 1.0);
    sun.position.set(800, 1200, 400);
    sun.castShadow = true;
    sun.shadow.camera.left = -2000;
    sun.shadow.camera.right = 2000;
    sun.shadow.camera.top = 1500;
    sun.shadow.camera.bottom = -1500;
    sun.shadow.camera.near = 100;
    sun.shadow.camera.far = 3500;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    // ==========================================================
    // GROUND
    // ==========================================================
    const groundGeo = new THREE.PlaneGeometry(8000, 5000, 40, 25);
    // Subtle height variation for visual interest
    const gPos = groundGeo.attributes.position;
    for (let i = 0; i < gPos.count; i++) {
      const x = gPos.getX(i);
      const z = gPos.getZ(i);
      // gentle rolling
      const h = Math.sin(x * 0.002) * 2 + Math.cos(z * 0.003) * 1.5 + Math.sin((x + z) * 0.001) * 3;
      gPos.setY(i, h);
    }
    groundGeo.computeVertexNormals();
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x4a7c3a });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(GOAL_DISTANCE / 2, 0, 0);
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid overlay for clear ground reference (100m squares)
    const grid = new THREE.GridHelper(8000, 80, 0x2a4a2a, 0x3a5a3a);
    grid.position.set(GOAL_DISTANCE / 2, 0.5, 0);
    grid.material.opacity = 0.6;
    grid.material.transparent = true;
    scene.add(grid);

    // Distance markers every 500m — poles with colored tops
    for (let d = 500; d < GOAL_DISTANCE; d += 500) {
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.6, 0.6, 15),
        new THREE.MeshLambertMaterial({ color: 0xffffff })
      );
      pole.position.set(d, 7.5, 0);
      pole.castShadow = true;
      scene.add(pole);
      const top = new THREE.Mesh(
        new THREE.SphereGeometry(2.5),
        new THREE.MeshLambertMaterial({ color: 0xff5555 })
      );
      top.position.set(d, 16, 0);
      scene.add(top);
    }

    // Decorative trees
    function makeTree(x, z) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.8, 1.2, 6),
        new THREE.MeshLambertMaterial({ color: 0x5a3c22 })
      );
      trunk.position.y = 3;
      trunk.castShadow = true;
      group.add(trunk);
      const foliage = new THREE.Mesh(
        new THREE.ConeGeometry(5, 12, 8),
        new THREE.MeshLambertMaterial({ color: 0x4a7c3a })
      );
      foliage.position.y = 10;
      foliage.castShadow = true;
      group.add(foliage);
      group.position.set(x, 0, z);
      group.rotation.y = Math.random() * Math.PI * 2;
      group.scale.setScalar(0.7 + Math.random() * 0.6);
      return group;
    }

    // Sprinkle some trees — deterministic seed so scene is consistent
    let seed = 42;
    function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (let i = 0; i < 60; i++) {
      const x = rand() * 4000 - 400;
      const z = rand() * 3000 - 1500;
      // keep clear around start and goal
      const distStart = Math.sqrt(x * x + z * z);
      const distGoal = Math.sqrt((x - GOAL_DISTANCE) ** 2 + z * z);
      if (distStart > 80 && distGoal > 80) {
        scene.add(makeTree(x, z));
      }
    }

    // ==========================================================
    // START & GOAL MARKERS
    // ==========================================================
    function makeFlagpole(color, height = 20) {
      const group = new THREE.Group();
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.4, height),
        new THREE.MeshLambertMaterial({ color: 0xd5c29a })
      );
      pole.position.y = height / 2;
      pole.castShadow = true;
      group.add(pole);
      const flag = new THREE.Mesh(
        new THREE.BoxGeometry(10, 6, 0.3),
        new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide })
      );
      flag.position.set(5, height - 4, 0);
      group.add(flag);
      return group;
    }

    const startMarker = makeFlagpole(0xe6554c);  // warm red
    scene.add(startMarker);

    const goalMarker = makeFlagpole(0x5ab557, 24);  // green
    goalMarker.position.set(GOAL_DISTANCE, 0, 0);
    scene.add(goalMarker);

    // Landing zone — golden circle on ground
    const landingZoneGeo = new THREE.CircleGeometry(LANDING_ZONE_RADIUS, 48);
    const landingZoneMat = new THREE.MeshLambertMaterial({
      color: 0xf2cc65,
      transparent: true,
      opacity: 0.65,
      side: THREE.DoubleSide,
    });
    const landingZone = new THREE.Mesh(landingZoneGeo, landingZoneMat);
    landingZone.rotation.x = -Math.PI / 2;
    landingZone.position.set(GOAL_DISTANCE, 0.3, 0);
    scene.add(landingZone);

    // Pulsing ring around landing zone
    const ringGeo = new THREE.RingGeometry(LANDING_ZONE_RADIUS + 1, LANDING_ZONE_RADIUS + 3, 48);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xfff2a6,
      transparent: true,
      opacity: 0.9,
      side: THREE.DoubleSide,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(GOAL_DISTANCE, 0.4, 0);
    scene.add(ring);

    // ==========================================================
    // BALLOON
    // ==========================================================
    const balloon = new THREE.Group();

    // GLB-Modell laden — normalisiert auf BALLON_TARGET_HEIGHT
    const gltfLoader = new GLTFLoader();
    const modelContainer = new THREE.Group();
    balloon.add(modelContainer);

    gltfLoader.load(
      `./models/${BALLON_MODEL}`,
      (gltf) => {
        const model = gltf.scene;
        model.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = true;
            obj.receiveShadow = true;
          }
        });
        const bbox = new THREE.Box3().setFromObject(model);
        const size = bbox.getSize(new THREE.Vector3());
        const scale = BALLON_TARGET_HEIGHT / size.y;
        model.scale.setScalar(scale);
        const bboxScaled = new THREE.Box3().setFromObject(model);
        model.position.y = -3 - bboxScaled.min.y;  // Korb-Unterkante bei y≈-3
        modelContainer.add(model);
        console.log(`Ballon-Modell "${BALLON_MODEL}" geladen, scale ${scale.toFixed(3)}`);
      },
      undefined,
      (error) => console.error('Ballon-Modell konnte nicht geladen werden:', error)
    );

    // Burner flame
    const flame = new THREE.Mesh(
      new THREE.ConeGeometry(1.2, 3.5, 8),
      new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: 0.9 })
    );
    flame.position.y = 0.5;
    flame.rotation.x = Math.PI;
    flame.visible = false;
    balloon.add(flame);

    // Flame light
    const flameLight = new THREE.PointLight(0xff9040, 0, 30);
    flameLight.position.y = 0;
    balloon.add(flameLight);

    scene.add(balloon);

    // Dedicated ground shadow indicator — directly below ballon,
    // grows/darkens as ballon nears ground
    const shadowGeo = new THREE.CircleGeometry(12, 48);
    const shadowMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.45,
      depthWrite: false,
    });
    const ballonShadow = new THREE.Mesh(shadowGeo, shadowMat);
    ballonShadow.rotation.x = -Math.PI / 2;
    ballonShadow.position.y = 0.6;  // float just above ground to avoid z-fighting
    ballonShadow.renderOrder = 2;
    scene.add(ballonShadow);

    // ==========================================================
    // BAND VISUALIZATION — colored translucent slabs at band midpoints
    // ==========================================================
    const BAND_COLORS = [0xff6b6b, 0x4ecdc4, 0xffe66a];
    const bandSlabs = [];
    for (let i = 0; i < BAND_COUNT; i++) {
      // Thin slab at band midpoint, colored by band
      const slab = new THREE.Mesh(
        new THREE.PlaneGeometry(8000, 4000),
        new THREE.MeshBasicMaterial({
          color: BAND_COLORS[i],
          transparent: true,
          opacity: 0.11,
          side: THREE.DoubleSide,
          depthWrite: false,
        })
      );
      slab.rotation.x = -Math.PI / 2;
      slab.position.set(GOAL_DISTANCE / 2, i * BAND_HEIGHT + BAND_HEIGHT / 2, 0);
      scene.add(slab);
      bandSlabs.push(slab);

      // Band boundary line (more visible)
      if (i > 0) {
        const boundary = new THREE.Mesh(
          new THREE.PlaneGeometry(8000, 4000),
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.18,
            side: THREE.DoubleSide,
            depthWrite: false,
          })
        );
        boundary.rotation.x = -Math.PI / 2;
        boundary.position.set(GOAL_DISTANCE / 2, i * BAND_HEIGHT, 0);
        scene.add(boundary);
      }
    }

    // ==========================================================
    // PROCEDURAL CLOUD TEXTURE + DRIFTING CLOUDS PER BAND
    // Each band's clouds drift in that band's wind direction,
    // wrapping around the playable area relative to the ballon.
    // ==========================================================
    function makeCloudTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      // Overlapping soft radial gradients = puffy cloud silhouette
      const puffs = [
        [60, 78, 42], [108, 50, 52], [155, 62, 48], [198, 74, 38],
        [90, 90, 35], [178, 92, 32], [130, 38, 30], [70, 55, 28],
      ];
      for (const [x, y, r] of puffs) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
        g.addColorStop(0.5, 'rgba(255, 255, 255, 0.45)');
        g.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 128);
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      return texture;
    }
    const cloudTexture = makeCloudTexture();

    const CLOUDS_PER_BAND = 16;
    const CLOUD_AREA_W = 2200;  // X-spread around ballon
    const CLOUD_AREA_D = 1600;  // Z-spread around ballon

    const clouds = [];
    for (let b = 0; b < BAND_COUNT; b++) {
      for (let i = 0; i < CLOUDS_PER_BAND; i++) {
        const mat = new THREE.SpriteMaterial({
          map: cloudTexture,
          transparent: true,
          opacity: 0.58 + Math.random() * 0.18,
          depthWrite: false,
        });
        const sprite = new THREE.Sprite(mat);
        const scale = 100 + Math.random() * 90;
        sprite.scale.set(scale, scale * 0.55, 1);
        sprite.position.set(
          (Math.random() - 0.5) * CLOUD_AREA_W,
          b * BAND_HEIGHT + BAND_HEIGHT / 2 + (Math.random() - 0.5) * 14,
          (Math.random() - 0.5) * CLOUD_AREA_D
        );
        scene.add(sprite);
        clouds.push({ sprite, band: b });
      }
    }

    // ==========================================================
    // IN-WORLD WIND ARROWS — one per band, at fixed X, at band altitude
    // Arrows rotate to point in wind direction
    // ==========================================================
    function makeArrow(color) {
      const group = new THREE.Group();
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(1.2, 1.2, 22),
        new THREE.MeshBasicMaterial({ color })
      );
      shaft.rotation.z = -Math.PI / 2;
      shaft.position.x = 11;
      group.add(shaft);
      const head = new THREE.Mesh(
        new THREE.ConeGeometry(3.5, 8),
        new THREE.MeshBasicMaterial({ color })
      );
      head.rotation.z = -Math.PI / 2;
      head.position.x = 26;
      group.add(head);
      return group;
    }

    const ARROW_COLORS = [0xff6b6b, 0x4ecdc4, 0xffe66a];  // Band 1, 2, 3
    const windArrows = [];
    for (let i = 0; i < BAND_COUNT; i++) {
      const arrow = makeArrow(ARROW_COLORS[i]);
      // Arrows follow ballon laterally; altitude stays at each band's midpoint
      arrow.position.set(0, i * BAND_HEIGHT + BAND_HEIGHT / 2, 0);
      // Rotate to point in wind direction (XZ plane)
      const w = BAND_WINDS[i];
      arrow.rotation.y = Math.atan2(-w.z, w.x);
      scene.add(arrow);
      windArrows.push(arrow);
    }

    // Wind panel arrow symbols (set based on actual wind angles)
    function windSymbol(v) {
      const angle = Math.atan2(-v.z, v.x);  // -z up in screen space
      const deg = angle * 180 / Math.PI;
      // Map to 8-way compass arrows
      if (deg >= -22.5 && deg < 22.5) return '→';
      if (deg >= 22.5 && deg < 67.5) return '↗';
      if (deg >= 67.5 && deg < 112.5) return '↑';
      if (deg >= 112.5 && deg < 157.5) return '↖';
      if (deg >= 157.5 || deg < -157.5) return '←';
      if (deg >= -157.5 && deg < -112.5) return '↙';
      if (deg >= -112.5 && deg < -67.5) return '↓';
      if (deg >= -67.5 && deg < -22.5) return '↘';
      return '·';
    }
    document.getElementById('arrow1').textContent = windSymbol(BAND_WINDS[0]);
    document.getElementById('arrow2').textContent = windSymbol(BAND_WINDS[1]);
    document.getElementById('arrow3').textContent = windSymbol(BAND_WINDS[2]);

    // ==========================================================
    // BALLOON STATE
    // ==========================================================
    const state = {
      position: new THREE.Vector3(0, 50, 0),
      burnerKeyDown: false,
      burnerPower: 0,
      landed: false,
      won: false,
      time: 0,
    };

    function reset() {
      state.position.set(0, 50, 0);
      state.burnerKeyDown = false;
      state.burnerPower = 0;
      state.landed = false;
      state.won = false;
      document.getElementById('winBanner').style.display = 'none';
    }

    // ==========================================================
    // WIND SAMPLING with soft band transitions
    // ==========================================================
    function getWindAt(y) {
      if (y <= 0) return new THREE.Vector3(0, 0, 0);
      if (y >= BAND_COUNT * BAND_HEIGHT) return BAND_WINDS[BAND_COUNT - 1].clone();

      const bandF = y / BAND_HEIGHT;
      const bandIdx = Math.min(Math.floor(bandF), BAND_COUNT - 1);
      const frac = bandF - bandIdx;

      // Within transition zone near top of band?
      if (frac > 1 - TRANSITION_WIDTH && bandIdx < BAND_COUNT - 1) {
        const t = (frac - (1 - TRANSITION_WIDTH)) / TRANSITION_WIDTH;
        const smoothT = t * t * (3 - 2 * t);  // smoothstep
        return BAND_WINDS[bandIdx].clone().lerp(BAND_WINDS[bandIdx + 1], smoothT);
      }
      return BAND_WINDS[bandIdx].clone();
    }

    // Turbulence — low-frequency, per-axis sine
    function applyTurbulence(wind, time) {
      const turbX = Math.sin(time * 0.3) * 0.5 + Math.sin(time * 0.17 + 1.3) * 0.5;
      const turbZ = Math.cos(time * 0.25 + 2.1) * 0.5 + Math.sin(time * 0.19) * 0.5;
      wind.x *= (1 + turbX * TURBULENCE_AMPLITUDE);
      wind.z *= (1 + turbZ * TURBULENCE_AMPLITUDE);
      return wind;
    }

    // ==========================================================
    // INPUT
    // ==========================================================
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        state.burnerKeyDown = true;
        e.preventDefault();  // block page scroll
      }
      if (e.code === 'KeyR') reset();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        state.burnerKeyDown = false;
        e.preventDefault();
      }
    });

    // ==========================================================
    // HUD UPDATE
    // ==========================================================
    function updateHUD() {
      document.getElementById('altitude').textContent = Math.round(state.position.y) + ' m';
      const bandIdx = Math.min(Math.floor(state.position.y / BAND_HEIGHT), BAND_COUNT - 1);
      const safeBand = Math.max(0, bandIdx);
      const bandNames = ['Band 1 (unten)', 'Band 2 (mitte)', 'Band 3 (oben)'];
      document.getElementById('band').textContent = bandNames[safeBand];
      const dx = state.position.x - GOAL_DISTANCE;
      const dz = state.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      document.getElementById('distance').textContent = Math.round(dist) + ' m';

      // Highlight active band in wind panel AND altitude bar
      for (let i = 1; i <= 3; i++) {
        document.getElementById('bandRow' + i).classList.toggle('active', i === safeBand + 1);
        document.getElementById('seg' + i).classList.toggle('active', i === safeBand + 1);
      }

      // Altitude marker on bar (% from bottom of 0-300m range)
      const totalHeight = BAND_COUNT * BAND_HEIGHT;
      const clampedY = Math.max(0, Math.min(state.position.y, totalHeight));
      const pct = (clampedY / totalHeight) * 100;
      document.getElementById('altMarker').style.bottom = `calc(${pct}% - 1px)`;

      // Also pulse the active band slab in 3D
      bandSlabs.forEach((slab, i) => {
        const isActive = (i === safeBand);
        slab.material.opacity = isActive ? 0.22 : 0.09;
      });
    }

    // ==========================================================
    // CAMERA FOLLOW
    // ==========================================================
    function updateCamera() {
      // Goal-oriented: camera is positioned behind ballon relative to goal direction
      // For this test, goal is always at +X, so camera stays behind in -X
      const camOffset = new THREE.Vector3(-180, 150, 170);
      const target = state.position.clone().add(camOffset);
      camera.position.lerp(target, 0.06);

      // Look ahead of ballon by some distance in +X direction (goal direction)
      const look = state.position.clone().add(new THREE.Vector3(150, -20, 0));
      camera.lookAt(look);
    }

    // ==========================================================
    // UPDATE LOOP
    // ==========================================================
    const clock = new THREE.Clock();

    function update(dt) {
      if (state.won) return;

      state.time += dt;

      // Burner ramp up/down
      if (state.burnerKeyDown && !state.landed) {
        state.burnerPower = Math.min(state.burnerPower + dt / BURNER_RAMP, 1);
      } else {
        state.burnerPower = Math.max(state.burnerPower - dt / (BURNER_RAMP * 0.7), 0);
      }

      // Vertical velocity: burner overcomes sink and adds rise
      const verticalVel = state.burnerPower * (ACTIVE_RISE + PASSIVE_SINK) - PASSIVE_SINK;

      // Wind at current altitude + turbulence
      const wind = getWindAt(state.position.y);
      applyTurbulence(wind, state.time);

      // Integrate
      state.position.x += wind.x * dt;
      state.position.y += verticalVel * dt;
      state.position.z += wind.z * dt;

      // Ground collision
      if (state.position.y <= 0) {
        state.position.y = 0;
        state.landed = true;
        const dx = state.position.x - GOAL_DISTANCE;
        const dz = state.position.z;
        if (Math.sqrt(dx * dx + dz * dz) < LANDING_ZONE_RADIUS) {
          state.won = true;
          document.getElementById('winBanner').style.display = 'block';
        }
      } else if (state.burnerPower > 0.1 && state.landed) {
        state.landed = false;  // lift off
      }

      // Ceiling clamp
      if (state.position.y > BAND_COUNT * BAND_HEIGHT + 20) {
        state.position.y = BAND_COUNT * BAND_HEIGHT + 20;
      }

      // Apply to mesh
      balloon.position.copy(state.position);

      // Ground shadow — directly below ballon, scales inverse with altitude
      ballonShadow.position.x = state.position.x;
      ballonShadow.position.z = state.position.z;
      const totalH = BAND_COUNT * BAND_HEIGHT;
      const altRatio = Math.min(state.position.y / totalH, 1);
      // Size: 0.4× at ground (tight dot under ballon) → 1.4× at max height (diffuse blob)
      const shadowScale = 0.4 + altRatio * 1.0;
      ballonShadow.scale.setScalar(shadowScale);
      // Opacity: 0.65 at ground (sharp, obvious) → 0.15 up high (faint, diffuse)
      ballonShadow.material.opacity = 0.65 - altRatio * 0.5;

      // Clouds drift in each band's wind direction, wrapping around ballon
      for (const c of clouds) {
        const w = BAND_WINDS[c.band];
        c.sprite.position.x += w.x * dt;
        c.sprite.position.z += w.z * dt;
        const dx = c.sprite.position.x - state.position.x;
        if (dx > CLOUD_AREA_W / 2) c.sprite.position.x -= CLOUD_AREA_W;
        else if (dx < -CLOUD_AREA_W / 2) c.sprite.position.x += CLOUD_AREA_W;
        const dz = c.sprite.position.z - state.position.z;
        if (dz > CLOUD_AREA_D / 2) c.sprite.position.z -= CLOUD_AREA_D;
        else if (dz < -CLOUD_AREA_D / 2) c.sprite.position.z += CLOUD_AREA_D;
      }

      // Wind arrows follow ballon laterally, stay at band altitudes
      const currentBandIdx = Math.min(Math.floor(state.position.y / BAND_HEIGHT), BAND_COUNT - 1);
      windArrows.forEach((arrow, i) => {
        arrow.position.x = state.position.x + 45;
        arrow.position.z = state.position.z + 70;
        arrow.position.y = i * BAND_HEIGHT + BAND_HEIGHT / 2;
        const isCurrent = (i === Math.max(0, currentBandIdx));
        const targetScale = isCurrent ? 1.35 : 0.85;
        const currentScale = arrow.scale.x;
        arrow.scale.setScalar(currentScale + (targetScale - currentScale) * 0.1);
      });

      // Flame visibility and intensity
      flame.visible = state.burnerPower > 0.05;
      flame.scale.y = 0.4 + state.burnerPower * 1.2;
      flame.scale.x = 0.7 + Math.sin(state.time * 30) * 0.1 * state.burnerPower;
      flameLight.intensity = state.burnerPower * 2.5;

      // Subtle wobble
      balloon.rotation.z = Math.sin(state.time * 0.7) * 0.02;
      balloon.rotation.x = Math.cos(state.time * 0.5) * 0.015;

      // Pulse ring around landing zone
      ring.scale.setScalar(1 + Math.sin(state.time * 2) * 0.08);
      ring.material.opacity = 0.6 + Math.sin(state.time * 2) * 0.25;

      updateCamera();
      updateHUD();
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      update(dt);
      renderer.render(scene, camera);
    }
    animate();

    // ==========================================================
    // RESIZE
    // ==========================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
